[project]
name = "molecule-generation-workflow"
version = "0.1.0"
description = "RL molecular generation with pluggable reward (transpharmer / REINFORCE)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2",
    "rdkit-pypi",
    "fvcore>=0.1.5",
    "numpy>=1.21,<2",
    "pandas>=1.3",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "tqdm>=4.67",
    "einops>=0.6",
    "xgboost",
    "mordred",
    "joblib",
    "scipy",
    "biopython",
    "scikit-learn>=1.6.1",
    "dotenv>=0.9.9",
    "umap-learn>=0.5.12",
    "openpyxl>=3.1.5",
    "ripser>=0.6.15",
    "selfies>=2.2.0",
    "admet-ai>=2.0.1",
    "vina>=1.2.7",
    "meeko>=0.8.0",
    "gemmi>=0.7.5",
]

[project.optional-dependencies]
tether = [
    "transformers",
    "unimol_tools",
]
preference = [
    "co2ie",
]
# HPC note: co2_binding_surrogate also works with vendored vendor/co2ie
# (surrogate-only) without installing the full CO2_IE_Dataset package.

[tool.uv.sources]
co2ie = { path = "../CO2_IE_Dataset", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
